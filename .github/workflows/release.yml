name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name to upload assets to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      CHRONICLE_UNIT_TEST_MODE: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Run Unit Tests
        run: |
          xcodebuild \
            -project Chronicle.xcodeproj \
            -scheme Chronicle \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/release-tests \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -testLanguage en \
            -testRegion US \
            test

      - name: Import signing certificate
        if: ${{ env.MACOS_CERTIFICATE_P12 != '' && env.MACOS_CERTIFICATE_PASSWORD != '' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/chronicle-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/chronicle-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"

      - name: Prepare notarization key
        if: ${{ env.APPLE_API_KEY_BASE64 != '' && env.APPLE_API_KEY_ID != '' && env.APPLE_API_ISSUER_ID != '' }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          {
            echo "NOTARYTOOL_KEY_PATH=$KEY_PATH"
            echo "NOTARYTOOL_KEY_ID=$APPLE_API_KEY_ID"
            echo "NOTARYTOOL_ISSUER_ID=$APPLE_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          DMG_VERSION: ${{ env.RELEASE_TAG }}
          NOTARYTOOL_KEY_PATH: ${{ env.NOTARYTOOL_KEY_PATH }}
          NOTARYTOOL_KEY_ID: ${{ env.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER_ID: ${{ env.NOTARYTOOL_ISSUER_ID }}
        run: |
          chmod +x script/build_and_run.sh
          chmod +x scripts/build_dmg.sh
          scripts/build_dmg.sh

      - name: Prepare release notes
        run: |
          mkdir -p build
          NOTES_PATH="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$NOTES_PATH" ]; then
            cp "$NOTES_PATH" build/release-notes.md
          else
            printf '# %s\n' "$RELEASE_TAG" > build/release-notes.md
          fi

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: build/release-notes.md
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.sha256
