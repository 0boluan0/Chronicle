name: Release DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import Code Signing Certificate
        if: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}

      - name: Build DMG
        env:
          DMG_VERSION: ${{ github.ref_name }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_CODESIGN_IDENTITY != '' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
        run: |
          chmod +x scripts/build_dmg.sh
          scripts/build_dmg.sh

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
