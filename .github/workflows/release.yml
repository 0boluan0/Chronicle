name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DMG
        env:
          DMG_VERSION: ${{ github.ref_name }}
        run: |
          chmod +x scripts/build_dmg.sh
          scripts/build_dmg.sh

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
