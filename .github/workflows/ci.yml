name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_smoke:
        description: "Run self-hosted UI smoke tests"
        required: false
        type: boolean
        default: false

jobs:
  build-and-unit-tests:
    runs-on: macos-26
    env:
      CHRONICLE_UNIT_TEST_MODE: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Build Debug
        run: |
          xcodebuild \
            -project Chronicle.xcodeproj \
            -scheme Chronicle \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run Unit Tests
        run: |
          xcodebuild \
            -project Chronicle.xcodeproj \
            -scheme Chronicle \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -testLanguage en \
            -testRegion US \
            test

      - name: Print crash diagnostics
        if: failure()
        run: |
          reports=$(find "$HOME/Library/Logs/DiagnosticReports" -type f \( -name 'Chronicle*.crash' -o -name 'Chronicle*.ips' \) | sort | tail -n 8)
          if [ -z "$reports" ]; then
            echo "No Chronicle crash reports found."
            exit 0
          fi
          for report in $reports; do
            echo "::group::$report"
            case "$report" in
              *.ips)
                ruby -rjson - "$report" <<'RUBY'
                  path = ARGV.fetch(0)
                  data = JSON.parse(File.read(path))
                  images = Array(data["usedImages"])
                  image_name = lambda do |index|
                    image = images[index.to_i] || {}
                    image["name"] || File.basename(image["path"].to_s)
                  end

                  puts "process: #{data["procName"] || data["processName"]}"
                  puts "exception: #{data["exception"].inspect}"
                  puts "termination: #{data["termination"].inspect}"

                  threads = Array(data["threads"])
                  faulting = data["faultingThread"] || data["crashedThread"] || data["triggeredThread"]
                  faulting ||= threads.index { |thread| thread["triggered"] || thread["crashed"] } || 0
                  puts "faultingThread: #{faulting}"

                  thread = threads[faulting.to_i] || {}
                  puts "threadName: #{thread["name"]}" if thread["name"]
                  Array(thread["frames"]).first(60).each_with_index do |frame, index|
                    symbol = frame["symbol"] || frame["symbolication"] || "<unknown>"
                    location = frame["symbolLocation"] || frame["imageOffset"]
                    puts "%02d %-36s %s + %s" % [index, image_name.call(frame["imageIndex"]), symbol, location]
                  end

                  puts "threadSummary:"
                  threads.each_with_index do |item, index|
                    frame = Array(item["frames"]).first || {}
                    symbol = frame["symbol"] || "<no frames>"
                    puts "%02d %-24s %s" % [index, item["name"].to_s, symbol]
                  end
                RUBY
                ;;
              *)
                sed -n '1,260p' "$report"
                ;;
            esac
            echo "::endgroup::"
          done

  ui-smoke:
    if: ${{ vars.CHRONICLE_UI_SMOKE_ENABLED == '1' || (github.event_name == 'workflow_dispatch' && inputs.run_ui_smoke) }}
    runs-on: [self-hosted, macOS, chronicle-ui]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [en, zh-Hans]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run UI Smoke
        run: |
          chmod +x script/run_ui_smoke.sh
          ./script/run_ui_smoke.sh "${{ matrix.language }}"
