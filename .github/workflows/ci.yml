name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_smoke:
        description: "Run self-hosted UI smoke tests"
        required: false
        type: boolean
        default: false
      ui_smoke_scope:
        description: "UI smoke scope for self-hosted runs"
        required: false
        type: choice
        default: all
        options:
          - all
          - full
          - surface
          - en
          - zh-Hans

jobs:
  build-and-unit-tests:
    runs-on: macos-26
    env:
      CHRONICLE_UNIT_TEST_MODE: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Build Debug
        run: |
          xcodebuild \
            -project Chronicle.xcodeproj \
            -scheme Chronicle \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run Unit Tests
        run: |
          xcodebuild \
            -project Chronicle.xcodeproj \
            -scheme Chronicle \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            -testLanguage en \
            -testRegion US \
            test

      - name: Print crash diagnostics
        if: failure()
        run: |
          reports=$(find "$HOME/Library/Logs/DiagnosticReports" -type f \( -name 'Chronicle*.crash' -o -name 'Chronicle*.ips' \) | sort | tail -n 8)
          if [ -z "$reports" ]; then
            echo "No Chronicle crash reports found."
            exit 0
          fi
          for report in $reports; do
            echo "::group::$report"
            case "$report" in
              *.ips)
                ruby .github/scripts/summarize_crash_report.rb "$report"
                ;;
              *)
                sed -n '1,260p' "$report"
                ;;
            esac
            echo "::endgroup::"
          done

  ui-smoke:
    if: ${{ vars.CHRONICLE_UI_SMOKE_ENABLED == '1' || (github.event_name == 'workflow_dispatch' && inputs.run_ui_smoke) }}
    runs-on: [self-hosted, macOS, chronicle-ui]
    timeout-minutes: 30
    env:
      UI_SMOKE_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_smoke_scope || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run UI Smoke
        run: |
          chmod +x script/run_ui_smoke.sh
          ./script/run_ui_smoke.sh "$UI_SMOKE_SCOPE"
